name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        # mongo:8 startet auf Runnern mit Kernel 6.19+ nicht (SERVER-121912); 7 reicht für die Tests
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_TEST_URI: mongodb://localhost:27017/visitflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
